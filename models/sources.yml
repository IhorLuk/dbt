version: 2

sources:
  - name: ecommerce
    database: bigquery-public-data
    schema: thelook_ecommerce
    tables:
      - name: orders
        identifier: orders
        description: api orders events
        config:
          freshness:
            warn_after:
              count: 1
              period: minute
            error_after:
              count: 2
              period: minute
          loaded_at_field: created_at
      - name: users
        identifier: users
        description: based on identityserver events
      - name: order_items
        identifier: order_items
      - name: products
        identifier: products

  - name: freshness_check
    database: analytics-dbt-395405
    schema: dbt_ihorluk
    tables:
      - name: dim_users_not_freshed
        freshness: 
          error_after:
            count: 2
            period: day
          warn_after:
            count: 1
            period: day
            
        loaded_at_field: created_at
        