version: 2

models:

  - name: dim_year
    columns:

      - name: year
        tests:
          - accepted_values:
              values: ['2015',
                      '2016',
                      '2017',
                      '2018',
                      '2019',
                      '2020',
                      '2021',
                      '2022',
                      '2023',
                      '2024',
                      '2025']
              quote: false
      
  - name: fct_avocado
    columns:
      - name: avg_price
        tests:
          - positive_value
